<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>부대 차량 구매 도우미</title>
<link rel="icon" href="data:,">
<!--
  부대 차량 구매 도우미 v1.0 (MVP)
  - 파일 하나로 동작한다. 외부 요청(CDN, 글꼴, API) 없음. 데이터는 이 PC 브라우저의 localStorage에만 저장한다.
  - 비밀 정보는 입력하지 않는다.
-->
<style>
:root{
  --ink:#1c2430; --muted:#5a6473; --line:#d5dae2; --bg:#eef1ee; --panel:#fff;
  --brand:#3d5a3a; --brand-dark:#2b4229; --brand-soft:#e4ece2;
  --green:#1d6b37; --green-bg:#dff1e4; --yellow:#7a5600; --yellow-bg:#fff1c2; --red:#a8231b; --red-bg:#fbe2df;
  --warn:#b3261e;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);min-width:1280px;font-size:14px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer;border:1px solid var(--brand);background:#fff;color:var(--brand-dark);border-radius:6px;padding:7px 14px;font-weight:600}
button:hover{background:var(--brand-soft)}
button.primary{background:var(--brand);color:#fff}
button.primary:hover{background:var(--brand-dark)}
button.danger{border-color:var(--red);color:var(--red)}
button.small{padding:3px 9px;font-size:13px}
input[type=text],input[type=number],select,textarea{border:1px solid #b9c0ca;border-radius:5px;padding:6px 8px;background:#fff}
input[type=number]{text-align:right}
input:focus,select:focus,textarea:focus{outline:2px solid #7d9c79;outline-offset:0}
h2{margin:0 0 4px;font-size:22px}
h3{margin:0 0 10px;font-size:16px}
.sub{color:var(--muted);margin:0 0 18px}

/* 왼쪽 메뉴 */
.side{position:fixed;left:0;top:0;bottom:0;width:230px;background:var(--brand-dark);color:#fff;display:flex;flex-direction:column;z-index:10}
.side .logo{padding:20px 18px 16px;font-size:17px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.15)}
.side .logo small{display:block;font-size:12px;font-weight:400;opacity:.75;margin-top:2px}
.side nav{flex:1;padding:10px 0}
.side nav a{display:flex;gap:10px;align-items:center;padding:12px 18px;color:#dfe8dc;text-decoration:none;font-weight:600;border-left:4px solid transparent;cursor:pointer}
.side nav a .no{display:inline-flex;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.15);align-items:center;justify-content:center;font-size:12px}
.side nav a:hover{background:rgba(255,255,255,.08)}
.side nav a.on{background:rgba(255,255,255,.14);border-left-color:#e9d27a;color:#fff}
.side .secret{margin:12px;padding:12px;border:2px solid #f0c24b;border-radius:8px;background:#5a2a1c;color:#fff;font-size:13px;line-height:1.45}
.side .secret b{display:block;font-size:15px;color:#ffd75e;margin-bottom:4px}

/* 상단 */
.main{margin-left:230px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:10px 28px}
.topbar .unit{font-size:17px;font-weight:700}
.topbar .meta{color:var(--muted);font-size:13px}
.topbar .grow{flex:1}
.topbar .backup.old{color:var(--warn);font-weight:700}
.content{padding:24px 28px 60px;max-width:1500px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label,.lbl{font-weight:600;font-size:13px;color:#39424f}
.field .hint{font-size:12px;color:var(--muted)}
.inline-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.check{display:flex;align-items:center;gap:8px;padding:6px 0}
.check input{width:18px;height:18px}
.unitlbl{color:var(--muted);font-size:13px}
.alert{border-radius:8px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.alert.warn{background:var(--red-bg);color:var(--red);border:1px solid #efb3ad}
.alert.info{background:#eef3fb;color:#24456e;border:1px solid #c6d5ec}
.alert.caution{background:var(--yellow-bg);color:var(--yellow);border:1px solid #ecd47f}

table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle}
th{background:#f4f6f3;font-size:13px;color:#39424f;white-space:nowrap}
td.num,th.num{text-align:right}
tr.off td{color:#9aa1ab}
.tbl-wrap{overflow-x:auto}

/* 태그: 색 + 글자 (흑백에서도 읽히도록 테두리와 기호 포함) */
.tag{display:inline-block;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:700;margin:1px 3px 1px 0;border:1px solid;white-space:nowrap}
.tag.green{background:var(--green-bg);color:var(--green);border-color:#9fd0ae}
.tag.green::before{content:"○ "}
.tag.yellow{background:var(--yellow-bg);color:var(--yellow);border-color:#e3c86a}
.tag.yellow::before{content:"△ "}
.tag.red{background:var(--red-bg);color:var(--red);border-color:#e9a29b}
.tag.red::before{content:"✕ "}
.tag.gray{background:#eef0f3;color:#4b5563;border-color:#c9ced6}

/* 용도 카드 */
.purpose-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.pcard{border:2px solid var(--line);border-radius:10px;background:#fff;padding:12px 10px 10px;text-align:center;cursor:pointer;color:#55606e;font-weight:700}
.pcard svg{width:100%;height:70px;display:block;margin-bottom:6px}
.pcard small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.pcard:hover{border-color:#94ac90}
.pcard.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark);box-shadow:0 0 0 3px rgba(61,90,58,.18)}
.pcard.on::after{content:"✔ 선택됨";display:block;font-size:12px;margin-top:4px;color:var(--brand)}

/* 막대 */
.bar{position:relative;height:16px;background:#eceff2;border:1px solid #b9c0ca;border-radius:3px;overflow:hidden;min-width:120px}
.bar > i{position:absolute;left:0;top:0;bottom:0;background:var(--brand)}
.bar > i.pen{background:repeating-linear-gradient(45deg,#a8231b 0 3px,#f5d0cc 3px 6px)}
.bar.big{height:22px}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.stack{display:flex;height:28px;border:1px solid #8a929d;border-radius:4px;overflow:hidden;background:#f2f4f6}
.stack > div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;border-right:1px solid #fff;white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:14px;height:14px;border:1px solid #555}
.pat0{background:#2b4229}.pat1{background:#4f7a4a}.pat2{background:repeating-linear-gradient(45deg,#4f7a4a 0 4px,#9cbc97 4px 8px)}
.pat3{background:#8a6d1f}.pat4{background:repeating-linear-gradient(45deg,#8a6d1f 0 4px,#d6c08a 4px 8px)}

.breakdown{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.bd{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.bd .t{font-weight:700;margin-bottom:6px}
.bd .r{display:grid;grid-template-columns:72px 1fr 34px;gap:8px;align-items:center;font-size:12px;margin:3px 0}
.bd .bar{height:11px;min-width:0}

.reasons{margin:0;padding-left:22px}
.reasons li{margin:4px 0}
.close-note{display:inline-block;background:var(--yellow-bg);border:1px solid #e3c86a;color:var(--yellow);font-weight:700;padding:3px 10px;border-radius:5px;margin-bottom:8px}
.ref h4{margin:12px 0 6px;font-size:14px}
.ref .empty,.empty{color:var(--muted);font-size:13px}
.ref ul{margin:0;padding-left:18px;font-size:13px}
.live{background:#f7f9f6;border:1px dashed #94ac90;border-radius:8px;padding:10px 14px}
.weights .w{display:grid;grid-template-columns:110px 1fr 60px;gap:10px;align-items:center;margin:6px 0}
.weights input[type=range]{width:100%}
.sum{font-weight:700}
.sum.bad{color:var(--warn)}
.toast{position:fixed;right:24px;bottom:24px;background:#1c2430;color:#fff;padding:12px 18px;border-radius:8px;font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:460px}
.toast.show{opacity:1}
.tight td,.tight th{padding:4px 5px}
.tight input,.tight select{padding:3px 5px;font-size:13px}
.mono{font-family:Consolas,"Malgun Gothic",monospace}

/* 보고서 (A4 세로) */
.report-tools{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.sheet{width:210mm;min-height:297mm;background:#fff;margin:0 auto 18px;padding:16mm 15mm;box-shadow:0 2px 10px rgba(0,0,0,.15);color:#000;font-size:10.5pt;line-height:1.55}
.sheet h1{font-size:17pt;text-align:center;margin:0 0 4mm;letter-spacing:-.5px}
.sheet .stamp{text-align:right;font-size:9.5pt;margin-bottom:5mm}
.sheet h5{font-size:11.5pt;margin:5mm 0 2mm;border-bottom:1.5px solid #000;padding-bottom:1mm}
.sheet table{font-size:9.5pt}
.sheet th,.sheet td{border:1px solid #555;padding:3px 5px}
.sheet th{background:#e6e6e6;color:#000}
.sheet .bar{border-color:#333;background:#fff;height:12px;min-width:60px}
.sheet .bar > i{background:#333}
.sheet ol,.sheet ul{margin:1mm 0;padding-left:6mm}
.sheet .foot{margin-top:6mm;border-top:1px solid #000;padding-top:2mm;font-size:8.5pt;color:#222}
.sheet .tag{border-color:#333;color:#000;background:#fff}
.sheet .close-note{border-color:#333;color:#000;background:#fff}
textarea.copytext{width:100%;height:340px;font-size:13px;line-height:1.55;white-space:pre}

@media print{
  @page{size:A4 portrait;margin:0}
  body{background:#fff;min-width:0}
  .side,.topbar,.no-print,.toast{display:none !important}
  .main{margin:0}
  .content{padding:0;max-width:none}
  .sheet{box-shadow:none;margin:0;width:210mm;min-height:auto}
  .sheet tr,.sheet li{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

const clone = o => JSON.parse(JSON.stringify(o));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const fmt = (n, d=0) => Number(n || 0).toLocaleString('ko-KR', {minimumFractionDigits:d, maximumFractionDigits:d});
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const purposeOf = id => PURPOSES.find(p => p.id === id) || PURPOSES[0];
const effUnit = fuel => fuel === '전기' ? 'km/kWh' : fuel === '수소' ? 'km/kg' : 'km/L';
const today = () => { const d = new Date(); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; };
// 받침 유무에 따라 '은/는'을 붙인다
const topic = w => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return w + (c >= 0 && c < 11172 && c % 28 ? '은' : '는'); };
const GANADA = '가나다라마바사아자차카타파하';

function defaultState(){
  return {
    schemaVersion: SCHEMA_VERSION,
    profile:{name:'', totalBudget:0, licenses:{l1big:0,l1:0,l1auto:0,l2:0,l2auto:0},
      env:{paved:true, unpaved:false, mountain:false, cold:false}, evCharger:false, h2Access:false, annualKm:15000},
    cond:{purpose:'sedan', qty:1, perUnitBudget:0, perUnitOverride:false, seats:0, payload:0, drivers:2, newUsed:'both'},
    weights: clone(DEFAULT_WEIGHTS),
    prices:{}, excluded:{}, used:[],
    vehicles: clone(DEFAULT_VEHICLES),
    licenseRules: clone(DEFAULT_LICENSE_RULES),
    energy: clone(DEFAULT_ENERGY),
    cases:[], plans:[], history:[],
    meta:{lastSaved:null, lastBackup:null},
  };
}

// 저장 데이터에 빠진 항목은 기본값으로 채운다 (이전 버전·일부 손상 대비)
function normalize(d){
  const s = defaultState();
  if (!d || typeof d !== 'object') return s;
  const obj = (a, b) => (b && typeof b === 'object' && !Array.isArray(b)) ? Object.assign(a, b) : a;
  obj(s.profile, d.profile);
  s.profile.licenses = obj(defaultState().profile.licenses, d.profile && d.profile.licenses);
  s.profile.env = obj(defaultState().profile.env, d.profile && d.profile.env);
  obj(s.cond, d.cond);
  obj(s.weights, d.weights);
  obj(s.prices, d.prices);
  obj(s.excluded, d.excluded);
  for (const k of ['used','vehicles','licenseRules','cases','plans','history']) if (Array.isArray(d[k])) s[k] = d[k];
  if (d.energy && typeof d.energy === 'object') for (const k of Object.keys(s.energy)) if (d.energy[k]) Object.assign(s.energy[k], d.energy[k]);
  obj(s.meta, d.meta);
  s.schemaVersion = SCHEMA_VERSION;
  return s;
}

let state = load();
let screen = 'profile';

function load(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) { console.warn('저장 데이터를 읽지 못해 기본값으로 시작합니다', e); }
  return defaultState();
}
function save(){
  state.meta.lastSaved = new Date().toISOString();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { toast('브라우저 저장에 실패했습니다. JSON 백업으로 보관하세요.'); }
  updateTopbar();
}

/* ---------------- 평가 엔진 (PRD 8장) ---------------- */
function perUnitBudget(){
  const c = state.cond;
  if (c.perUnitOverride) return num(c.perUnitBudget);
  return c.qty > 0 ? Math.round(num(state.profile.totalBudget) / num(c.qty)) : 0;
}
function totalDrivers(){ return LICENSES.reduce((a, l) => a + num(state.profile.licenses[l.id]), 0); }
function ruleAllows(r, v){
  let ok;
  if (v.cls === '승용') ok = !!r.sedan;
  else if (v.cls === '승합') ok = r.vanMax == null || r.vanMax === '' || num(v.seats) <= num(r.vanMax);
  else ok = r.truckMax == null || r.truckMax === '' || (r.truckInclusive ? num(v.payload) <= num(r.truckMax) : num(v.payload) < num(r.truckMax));
  if (v.trans === '수동' && !r.manual) ok = false;
  return ok;
}
function driversFor(v){
  return state.licenseRules.reduce((a, r) => a + (ruleAllows(r, v) ? num(state.profile.licenses[r.id]) : 0), 0);
}
function vehName(v){ return `${v.maker} ${v.model} ${v.trim}`.trim(); }
function vehSpec(v){ return `${v.fuel}·${v.trans}${v.drive === '4WD' ? '·4WD' : ''}`; }

// 선택한 용도의 후보 목록 (신차 + 중고)
function candidates(){
  const c = state.cond, out = [];
  if (c.newUsed !== 'used') for (const v of state.vehicles) if (v.use === c.purpose)
    out.push({key:v.id, veh:v, used:null, name:vehName(v), price:num(state.prices[v.id]), excluded:!!state.excluded[v.id]});
  if (c.newUsed !== 'new') for (const u of state.used) {
    const v = state.vehicles.find(x => x.id === u.baseId);
    if (!v || v.use !== c.purpose) continue;
    out.push({key:'u:'+u.id, veh:v, used:u, name:`${vehName(v)} (중고 ${u.year}년식)`, price:num(u.price), excluded:!!state.excluded['u:'+u.id]});
  }
  return out;
}

function evaluate(){
  const s = state, c = s.cond, p = s.profile, w = s.weights;
  const budget = perUnitBudget();
  const all = candidates();
  const list = all.filter(x => !x.excluded && x.price > 0);
  const nowYear = new Date().getFullYear();
  for (const x of list) {
    const v = x.veh;
    const sc = {};
    // 용도 적합성
    const seatS = num(c.seats) > 0 ? 10 * Math.min(1, num(v.seats) / num(c.seats)) : 10;
    const loadS = num(c.payload) > 0 ? 10 * Math.min(1, num(v.payload) / num(c.payload)) : 10;
    sc.fit = Math.min(seatS, loadS);
    // 예산: 1% 초과마다 1점 감점
    x.overPct = budget > 0 ? (x.price - budget) / budget * 100 : 0;
    sc.budget = (budget <= 0 || x.price <= budget) ? 10 : Math.max(0, 10 - x.overPct);
    // 유지비 (만 원)
    const e = s.energy[ENERGY_OF[v.fuel]];
    const energyYear = num(v.eff) > 0 ? num(p.annualKm) / num(v.eff) * num(e && e.price) / 10000 : 0;
    x.maintYear = num(v.maint) * (x.used ? USED_MAINT_RATE : 1);
    x.cost5 = (energyYear + x.maintYear) * 5;
    x.energyYear = energyYear;
    sc.eco = ECO_SCORE[v.fuel] ?? 0;
    sc.conv = v.trans === '수동' ? 5 : 10;
    x.sc = sc;
    x.drivers = driversFor(v);
    x.licenseBad = x.drivers < num(c.drivers);
    x.infraBad = (v.fuel === '전기' && !p.evCharger) || (v.fuel === '수소' && !p.h2Access);
    x.budgetBad = budget > 0 && x.price > budget;
    x.age = x.used ? Math.max(0, nowYear - num(x.used.year)) : 0;
  }
  const minCost = Math.min(...list.map(x => x.cost5).filter(v => v > 0));
  for (const x of list) {
    x.sc.maint = x.cost5 > 0 && isFinite(minCost) ? 10 * minCost / x.cost5 : 10;
    x.total = CRITERIA.reduce((a, k) => a + x.sc[k.id] * num(w[k.id]) / 100, 0) * 10;
    x.penalty = (x.licenseBad ? PENALTY_LICENSE : 0) + (x.infraBad ? PENALTY_INFRA : 0);
    x.final = Math.max(0, x.total - x.penalty);
    x.tags = tagsFor(x, budget);
    x.limits = limitsFor(x, budget);
  }
  list.sort((a, b) => b.final - a.final || b.total - a.total);
  list.forEach((x, i) => x.rank = i + 1);
  const weightSum = CRITERIA.reduce((a, k) => a + num(w[k.id]), 0);
  return {list, all, budget, weightSum, reasons: reasonsFor(list, budget), unpriced: all.filter(x => !x.excluded && !(x.price > 0))};
}

function tagsFor(x, budget){
  const v = x.veh, env = state.profile.env, t = [];
  t.push(x.licenseBad ? {lv:'red', text:'면허 부적합'} : {lv:'green', text:'면허 적합'});
  if (budget > 0) t.push(x.budgetBad ? {lv:'red', text:'예산 초과'} : {lv:'green', text:'예산 이내'});
  if (x.infraBad) t.push({lv:'yellow', text:'충전 인프라 부족'});
  if (v.fuel === '전기' && env.cold) t.push({lv:'yellow', text:'동절기 주행거리 감소 주의'});
  if (v.drive === '2WD' && (env.unpaved || env.mountain)) t.push({lv:'yellow', text:'험로 운행 주의'});
  if (x.used) t.push({lv:'yellow', text:`중고 연식 ${x.age}년, 주행 ${fmt(x.used.km)}km`});
  return t;
}

// 제한사항과 대책 (PRD 8.6)
function limitsFor(x, budget){
  const v = x.veh, env = state.profile.env, c = state.cond, L = [];
  if (x.licenseBad) L.push({text:`면허 부적합 — 운전 가능 인원 ${x.drivers}명 (필요 ${num(c.drivers)}명)${v.trans === '수동' ? ', 수동변속기는 자동 한정 면허 운전 불가' : ''} [−${PENALTY_LICENSE}점]`,
    measure:'자동변속기 트림 선택 또는 운전 인원 면허 취득 교육 계획 반영'});
  if (x.budgetBad) {
    const per = x.price - budget, qty = Math.max(1, num(c.qty));
    L.push({text:`예산 초과 — 대당 ${fmt(per)}만 원 초과 (${fmt(x.overPct,1)}%)`,
      measure:`하위 트림 검토 또는 예산 ${fmt(per * qty)}만 원 증액 소요 반영${qty > 1 ? ` (대당 ${fmt(per)}만 원 × ${qty}대)` : ''}`});
  }
  if (x.infraBad) L.push({text:`충전 인프라 부족 — ${v.fuel === '수소' ? '수소 충전소 접근 불가' : '전기 충전기 없음'} [−${PENALTY_INFRA}점]`,
    measure:'충전기 설치 소요 및 예산 반영 필요'});
  if (v.fuel === '전기' && env.cold) L.push({text:'혹한지 전기차 — 동절기 주행거리 감소', measure:'동절기 운행 거리 여유 확보 및 실내 주차 검토'});
  if (v.drive === '2WD' && (env.unpaved || env.mountain)) L.push({text:`험로 2WD — ${[env.unpaved && '비포장', env.mountain && '산악 지형'].filter(Boolean).join('·')} 운행 환경`,
    measure:'4WD 트림 검토 또는 험로 운행 제한'});
  if (x.used) L.push({text:`중고차 — 연식 ${x.age}년, 주행 ${fmt(x.used.km)}km (정비비 +30% 반영)`, measure:'정비 이력 확인 및 잔여 보증 기간 확인'});
  return L;
}

// 1순위 선정 사유 (PRD 8.5)
function reasonsFor(list, budget){
  if (!list.length) return {lines:[], close:false};
  const a = list[0], b = list[1], c = state.cond, w = state.weights;
  const fitText = () => {
    const parts = [];
    if (num(c.seats) > 0) parts.push(`필요 승차 인원 ${num(c.seats)}명`);
    if (num(c.payload) > 0) parts.push(`적재량 ${num(c.payload)}톤`);
    if (a.sc.fit >= 10) return parts.length ? `${parts.join(', ')}을 모두 충족함` : '용도 조건을 모두 충족함';
    return `용도 적합성 ${fmt(a.sc.fit,1)}점으로 2순위(${fmt(b ? b.sc.fit : 0,1)}점)보다 높음 (승차정원 ${a.veh.seats}명${num(a.veh.payload) ? `, 적재 ${a.veh.payload}톤` : ''})`;
  };
  const tpl = {
    fit: fitText,
    budget: () => (budget > 0 && a.price <= budget)
      ? `대당 예산 대비 ${fmt(budget - a.price)}만 원 절감 (예산 집행률 ${fmt(a.price / budget * 100, 1)}%)`
      : `예산 초과 폭이 2순위보다 작음 (대당 ${fmt(a.price - budget)}만 원 초과)`,
    maint: () => b ? `5년 유지비가 2순위 대비 ${fmt(b.cost5 - a.cost5)}만 원 적음 (대당 5년 ${fmt(a.cost5)}만 원)` : `5년 유지비 대당 ${fmt(a.cost5)}만 원`,
    eco: () => a.sc.eco >= 10 ? `${a.veh.fuel} 차량으로 친환경 기준 최고 점수` : `${a.veh.fuel} 차량으로 친환경 점수가 2순위(${b ? b.veh.fuel : '-'})보다 높음`,
    conv: () => a.drivers >= totalDrivers() && totalDrivers() > 0
      ? `자동변속기로 운전 가능 인원 ${a.drivers}명 전원 운행 가능`
      : `자동변속기로 운전 가능 인원 ${a.drivers}명 운행 가능`,
  };
  if (!b) {
    const lines = CRITERIA.map(k => ({k, v:a.sc[k.id] * num(w[k.id])})).sort((x, y) => y.v - x.v).slice(0, 3).map(o => tpl[o.k.id]());
    return {lines:['단독 후보로 비교 대상 없음', ...lines].slice(0, 3), close:false};
  }
  const diffs = CRITERIA.map(k => ({k, d:a.sc[k.id] - b.sc[k.id], contrib:num(w[k.id]) * (a.sc[k.id] - b.sc[k.id])}));
  const ahead = diffs.filter(o => o.d > 1e-9).sort((x, y) => y.contrib - x.contrib);
  const behind = diffs.filter(o => o.d < -1e-9).sort((x, y) => x.contrib - y.contrib);
  const lines = ahead.slice(0, 3).map(o => tpl[o.k.id]());
  for (const o of behind) { if (lines.length >= 3) break; lines.push(`다만 ${topic(o.k.label)} ${b.name}이(가) 우수함`); }
  if (lines.length < 3 && a.penalty < b.penalty) lines.push(`감점 ${fmt(a.penalty)}점으로 2순위(${fmt(b.penalty)}점)보다 제한사항이 적음`);
  // 점수가 같은 기준은 가중치가 큰 순서로 '같은 수준'임을 밝힌다
  const ties = diffs.filter(o => Math.abs(o.d) <= 1e-9).sort((x, y) => num(w[y.k.id]) - num(w[x.k.id]));
  for (const o of ties) { if (lines.length >= 3) break; lines.push(`${topic(o.k.label)} 2순위(${b.name})와 같은 수준 (${fmt(a.sc[o.k.id],1)}점)`); }
  return {lines, close: a.final - b.final <= CLOSE_GAP};
}

function renderNav(){
  $('#nav').innerHTML = SCREENS.map((s, i) => `<a class="${s.id === screen ? 'on' : ''}" onclick="go('${s.id}')"><span class="no">${i+1}</span>${s.label}</a>`).join('');
}
function go(id){ screen = id; renderNav(); render(); window.scrollTo(0, 0); }
function render(){
  const v = $('#view');
  v.innerHTML = ({profile:viewProfile, cond:viewCond, rank:viewRank, report:viewReport, records:viewRecords})[screen]();
  if (screen === 'report') $('#reportText').value = reportText(evaluate());
}
function updateTopbar(){
  $('#tbUnit').textContent = state.profile.name ? state.profile.name : '부대명 미입력';
  const ls = state.meta.lastSaved ? new Date(state.meta.lastSaved) : null;
  $('#tbSaved').textContent = ls ? `마지막 저장 ${ls.toLocaleDateString('ko-KR')} ${ls.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'})}` : '아직 저장 안 됨';
  const lb = state.meta.lastBackup ? new Date(state.meta.lastBackup) : null;
  const el = $('#tbBackup');
  if (!lb) { el.textContent = '백업 기록 없음 — JSON 백업을 권장합니다'; el.classList.add('old'); }
  else {
    const days = Math.floor((Date.now() - lb.getTime()) / 86400000);
    el.textContent = `마지막 백업 ${days}일 전${days === 0 ? ' (오늘)' : ''}`;
    el.classList.toggle('old', days >= 7);
  }
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3200);

function weightSumHtml(){
  const s = CRITERIA.reduce((a, k) => a + num(state.weights[k.id]), 0);
  return `<span class="sum ${s === 100 ? '' : 'bad'}">합계 ${s}%${s === 100 ? ' ✔' : ' — 합계가 100%가 아닙니다. 조정하세요.'}</span>`;
}
function liveSummary(){
  const r = evaluate();
  if (!r.list.length) return '<b>즉시 계산:</b> 가격이 입력된 후보가 없습니다. 가격을 입력하면 순위가 바로 계산됩니다.';
  return `<b>즉시 계산:</b> ${r.list.slice(0, 3).map(x => `${x.rank}위 ${esc(x.name)} (${esc(vehSpec(x.veh))}) <b>${fmt(x.final,1)}점</b>`).join(' · ')}
    ${r.unpriced.length ? `<span class="unitlbl"> — 가격 미입력 ${r.unpriced.length}대는 순위에서 제외</span>` : ''} <button class="small primary" style="margin-left:8px" onclick="go('rank')">순위·분석 보기 →</button>`;
}
function setPurpose(id){ state.cond.purpose = id; save(); render(); }
function resetPerUnit(){ state.cond.perUnitOverride = false; save(); render(); }
function resetWeights(){ state.weights = clone(DEFAULT_WEIGHTS); save(); render(); }
function toggleExclude(key, ex){ if (ex) state.excluded[key] = true; else delete state.excluded[key]; save(); render(); }
function addUsed(){
  const price = num($('#uPrice').value), year = num($('#uYear').value), km = num($('#uKm').value);
  if (!price) { toast('중고 가격을 입력하세요.'); return; }
  if (!year) { toast('연식을 입력하세요.'); return; }
  state.used.push({id:uid('used'), baseId:$('#uBase').value, year, km, price});
  save(); render(); toast('중고 후보를 추가했습니다.');
}
function removeUsed(id){ state.used = state.used.filter(u => u.id !== id); delete state.excluded['u:'+id]; save(); render(); }

/* 3. 순위·분석 */
function warnings(r){
  const w = [];
  if (r.weightSum !== 100) w.push(`<div class="alert warn">가중치 합계가 ${r.weightSum}%입니다. 100%로 맞춰야 총점이 100점 만점이 됩니다.</div>`);
  if (!(r.budget > 0)) w.push('<div class="alert caution">대당 예산이 0입니다. 부대 프로필의 총예산 또는 구매 조건의 대당 예산을 입력하세요. (예산 판정 생략)</div>');
  if (!(totalDrivers() > 0)) w.push('<div class="alert caution">운전 인원 면허 현황이 비어 있어 모든 차량이 면허 부적합으로 판정됩니다. 부대 프로필에서 입력하세요.</div>');
  return w.join('');
}

  ${warnings(r)}
  <div class="grid-main"><div>
   <div class="card"><div class="row" style="margin-bottom:10px"><h3 style="margin:0">순위표</h3><div style="flex:1"></div><button onclick="saveHistory()">이 평가 이력 저장</button><button class="primary" onclick="go('report')">보고서로 →</button></div>
    <table><tr><th>순위</th><th>차량 (연료·변속기)</th><th>가격</th><th style="width:30%">최종 점수 (100점)</th><th class="num">감점</th><th>상태</th></tr>
    ${list.map(x => `<tr><td class="score">${x.rank}</td><td><b>${esc(x.name)}</b><br><span class="unitlbl">${esc(vehSpec(x.veh))} · 운전 가능 ${x.drivers}명</span></td>
      <td class="num">${fmt(x.price)}만 원</td>
      <td><div class="row" style="flex-wrap:nowrap"><div class="bar big" style="flex:1"><i style="width:${x.final}%"></i>${x.penalty ? `<i class="pen" style="left:${x.final}%;width:${Math.min(x.penalty, 100 - x.final)}%"></i>` : ''}</div><span class="score" style="width:46px;text-align:right">${fmt(x.final,1)}</span></div></td>
      <td class="num">${x.penalty ? `<b style="color:var(--red)">−${x.penalty}</b>` : '0'}</td>
      <td>${x.tags.map(tag).join('')}</td></tr>`).join('')}
    </table>
    <p class="unitlbl" style="margin:8px 0 0">막대의 빗금 부분은 감점(면허 부적합 −15, 충전 인프라 부족 −5)입니다. 가격 미입력·제외 후보 ${r.all.length - list.length}대는 순위에 없습니다.</p>
   </div>
   <div class="card"><h3>1순위 선정 사유 — ${esc(a.name)}</h3>

   </div>
   <div class="card"><h3>제한사항 및 대책</h3>${limitsTable(list)}</div>
  </div>
  <div class="card ref"><h3>참고 패널 <span class="unitlbl">(점수 미반영)</span></h3>${refPanel()}</div>
  </div>`;
}
function vehicleSummary(x, a){
  const strong = CRITERIA.map(k => ({k, v:x.sc[k.id]})).filter(o => o.v >= 9.95).map(o => o.k.label);
  if (x === a) return `총점 ${fmt(x.total,1)}점${x.penalty ? `, 감점 ${x.penalty}점` : ''}. 만점 기준: ${strong.join(', ') || '없음'}`;

  return `1순위 대비 ${fmt(a.final - x.final,1)}점 낮음${gaps.length ? ' · 주요 차이: ' + gaps.map(o => `${o.k.label} −${fmt(o.d,1)}점`).join(', ') : ''}${x.penalty > a.penalty ? ` · 감점 ${x.penalty}점` : ''}`;

function reportText(r){
  const c = state.cond, P = purposeOf(c.purpose), list = r.list, top = list.slice(0, 5);
  const {cases, plans} = refItems();
  const g = i => GANADA[i] + '.';
  const out = [];
  out.push(`${unitName()} ${P.report} 구매 검토 결과`, `(${today()})`, '');
  out.push('1. 구매 목적');
  out.push(`  ${g(0)} 용도: ${P.label}(${P.desc}), 구매 대수 ${c.qty}대`);
  out.push(`  ${g(1)} 필요 조건: 승차 인원 ${num(c.seats) ? num(c.seats) + '명' : '조건 없음'}, 적재량 ${num(c.payload) ? num(c.payload) + '톤' : '조건 없음'}, 운전 인원 ${num(c.drivers)}명`);
  out.push('2. 부대 조건');
  out.push(`  ${g(0)} 예산: 총 ${fmt(state.profile.totalBudget)}만 원(대당 ${fmt(r.budget)}만 원)`);
  out.push(`  ${g(1)} 운전 인원 면허: ${licenseText()}`);
  out.push(`  ${g(2)} 운행 환경: ${envText()}, 연간 주행 ${fmt(state.profile.annualKm)}km/대`);
  out.push(`  ${g(3)} 충전 인프라: ${infraText()}`);
  out.push('3. 검토 결과(순위)');
  if (!top.length) out.push('  가. 가격이 입력된 후보 없음');
  top.forEach((x, i) => {
    out.push(`  ${g(i)} ${x.rank}순위: ${x.name}(${vehSpec(x.veh)}) ${fmt(x.final,1)}점, ${fmt(x.price)}만 원`);
    out.push(`    1) 기준별 점수: ${CRITERIA.map(k => `${k.label} ${fmt(x.sc[k.id],1)}`).join(', ')}${x.penalty ? `, 감점 −${x.penalty}` : ''}`);
    out.push(`    2) 상태: ${x.tags.map(t => t.text).join(', ')}`);
  });
  out.push('4. 1순위 선정 사유' + (list[0] ? `(${list[0].name})` : ''));
  if (r.reasons.close) out.push('  ※ 근소한 차이: 추가 검토 권장');
  r.reasons.lines.forEach((l, i) => out.push(`  ${g(i)} ${l}`));
  out.push('5. 제한사항 및 대책');
  const lim = top.filter(x => x.limits.length);
  if (!lim.length) out.push('  가. 제한사항 없음(예산 이내, 면허 적합)');
  lim.forEach((x, i) => {
    out.push(`  ${g(i)} ${x.rank}순위 ${x.name}`);
    x.limits.forEach((l, j) => out.push(`    ${j + 1}) ${l.text} → 대책: ${l.measure}`));
  });
  out.push('6. 참고(점수 미반영)');
  out.push(`  ${g(0)} 전년도 구매 사례: ${cases.length ? cases.map(x => `${x.year}년 ${x.model} ${fmt(x.price)}만 원(만족도 ${x.score}/5)`).join('; ') : '없음'}`);
  out.push(`  ${g(1)} 일괄 보급 계획: ${plans.length ? plans.map(x => `${x.model} ${x.qty}대(${x.when})`).join('; ') : '없음'}`);
  out.push(`※ 평가 기준(가중치): ${CRITERIA.map(k => `${k.label} ${num(state.weights[k.id])}%`).join(', ')} / 감점: 면허 부적합 −${PENALTY_LICENSE}, 충전 인프라 부족 −${PENALTY_INFRA}`);
  return out.join('\n');
}

   <div class="tbl-wrap"><table class="tight"><tr><th>용도</th><th>제조사</th><th>모델명</th><th>트림</th><th>차급</th><th>연료</th><th>변속기</th><th>구동</th><th>정원</th><th>적재(t)</th><th>연비</th><th>정비비(만/년)</th><th>확인</th><th>비고</th><th></th></tr>
   ${s.vehicles.map((v, i) => `<tr><td>${purposeSelect(`vehicles.${i}.use`, v.use)}</td><td>${txt(`vehicles.${i}.maker`, v.maker, 64)}</td><td>${txt(`vehicles.${i}.model`, v.model, 130)}</td><td>${txt(`vehicles.${i}.trim`, v.trim, 170)}</td>
     <td>${opts(`vehicles.${i}.cls`, CLASSES, v.cls)}</td><td>${opts(`vehicles.${i}.fuel`, FUELS, v.fuel)}</td><td>${opts(`vehicles.${i}.trans`, ['자동','수동'], v.trans)}</td><td>${opts(`vehicles.${i}.drive`, ['2WD','4WD'], v.drive)}</td>
     <td>${nIn(`vehicles.${i}.seats`, v.seats, 52, 1)}</td><td>${nIn(`vehicles.${i}.payload`, v.payload, 58)}</td><td>${nIn(`vehicles.${i}.eff`, v.eff, 58)}</td><td>${nIn(`vehicles.${i}.maint`, v.maint, 64)}</td>
     <td style="text-align:center"><input type="checkbox" data-k="vehicles.${i}.verified" data-t="bool" ${v.verified ? 'checked' : ''}></td><td>${txt(`vehicles.${i}.note`, v.note, 200)}</td>
     <td><button class="small danger" onclick="delVehicle(${i})">삭제</button></td></tr>`).join('')}</table></div>
  </div>
  <div class="grid2">
   <div class="card"><div class="row" style="margin-bottom:8px"><h3 style="margin:0">면허 규칙 (도로교통법 시행규칙 별표 18 기준)</h3><div style="flex:1"></div><button class="small danger" onclick="resetRules()">기본값</button></div>
    <table class="tight"><tr><th>면허</th><th>승용</th><th>승합 정원 상한(명)</th><th>화물 적재 상한(톤)</th><th>수동 차량</th></tr>
    ${s.licenseRules.map((r, i) => `<tr><td>${esc((LICENSES.find(l => l.id === r.id) || {label:r.id}).label)}</td>
      <td><select data-k="licenseRules.${i}.sedan" data-t="bool01"><option value="1" ${r.sedan ? 'selected' : ''}>가능</option><option value="0" ${!r.sedan ? 'selected' : ''}>불가</option></select></td>
      <td><input type="number" data-k="licenseRules.${i}.vanMax" data-t="numnull" value="${r.vanMax ?? ''}" placeholder="전체" style="width:70px"> 이하</td>
      <td><input type="number" data-k="licenseRules.${i}.truckMax" data-t="numnull" value="${r.truckMax ?? ''}" placeholder="전체" style="width:60px">
        <select data-k="licenseRules.${i}.truckInclusive" data-t="bool01"><option value="1" ${r.truckInclusive ? 'selected' : ''}>이하</option><option value="0" ${!r.truckInclusive ? 'selected' : ''}>미만</option></select></td>
      <td><select data-k="licenseRules.${i}.manual" data-t="bool01"><option value="1" ${r.manual ? 'selected' : ''}>가능</option><option value="0" ${!r.manual ? 'selected' : ''}>불가</option></select></td></tr>`).join('')}</table>
    <p class="unitlbl">빈칸은 '전체'(제한 없음). 1종 보통(자동 한정)은 현행 법령으로 최종 확인하세요.</p>
   </div>
   <div class="card"><div class="row" style="margin-bottom:8px"><h3 style="margin:0">에너지 단가</h3><div style="flex:1"></div><button class="small danger" onclick="resetEnergy()">기본값</button></div>
    <table class="tight"><tr><th>연료</th><th class="num">단가</th><th>비고 (출처·기준일)</th></tr>
    ${Object.entries(s.energy).map(([k, e]) => `<tr><td>${esc(e.label)}</td><td class="num"><input type="number" data-k="energy.${k}.price" data-t="num" value="${e.price}" step="any" style="width:90px"> ${esc(e.unit)}</td><td>${txt(`energy.${k}.note`, e.note, 250)}</td></tr>`).join('')}</table>
    <p class="unitlbl">휘발유 외 값은 개발 시점 추정값입니다. 오피넷(유가)·환경부(충전 요금) 최신값으로 고쳐 쓰세요.</p>
   </div>
  </div>`;
}
function addRow(kind){
  const use = state.cond.purpose;
  state[kind].push(kind === 'cases' ? {id:uid('c'), year:new Date().getFullYear() - 1, use, model:'', price:0, score:3, memo:''} : {id:uid('p'), use, model:'', qty:1, when:'', memo:''});
  save(); render();
}
function delRow(kind, i){ if (confirm('이 행을 삭제할까요?')) { state[kind].splice(i, 1); save(); render(); } }
function addVehicle(){
  state.vehicles.push({id:uid('v'), use:state.cond.purpose, maker:'', model:'새 차량', trim:'', cls:'승용', fuel:'가솔린', trans:'자동', drive:'2WD', seats:5, payload:0, eff:10, maint:60, verified:false, note:'사용자 추가'});
  save(); render(); toast('차량을 추가했습니다. 표 맨 아래에서 제원을 입력하세요.');
}
function delVehicle(i){
  const v = state.vehicles[i];
  if (!confirm(`'${vehName(v)}'을(를) 차량 DB에서 삭제할까요?`)) return;
  state.vehicles.splice(i, 1); delete state.prices[v.id]; delete state.excluded[v.id];
  state.used = state.used.filter(u => u.baseId !== v.id);
  save(); render();
}
function resetVehicles(){ if (confirm('차량 DB를 기본값으로 되돌릴까요? 직접 추가·수정한 차량은 사라집니다.')) { state.vehicles = clone(DEFAULT_VEHICLES); save(); render(); } }
function resetRules(){ if (confirm('면허 규칙을 기본값으로 되돌릴까요?')) { state.licenseRules = clone(DEFAULT_LICENSE_RULES); save(); render(); } }
function resetEnergy(){ if (confirm('에너지 단가를 기본값으로 되돌릴까요?')) { state.energy = clone(DEFAULT_ENERGY); save(); render(); } }
function loadHistory(id){
  const h = state.history.find(x => x.id === id); if (!h) return;
  Object.assign(state, clone(h.snapshot)); save(); toast('저장한 평가 조건을 불러왔습니다.'); go('rank');
}
function delHistory(id){ if (confirm('이 평가 이력을 삭제할까요?')) { state.history = state.history.filter(x => x.id !== id); save(); render(); } }

/* JSON 내보내기·가져오기 */
function exportPayload(type){
  const s = state, base = {schemaVersion:SCHEMA_VERSION, app:'부대차량구매도우미', type, exportedAt:new Date().toISOString()};
  if (type === 'vehicles') return Object.assign(base, {vehicles:s.vehicles});
  return Object.assign(base, {profile:s.profile, cond:s.cond, weights:s.weights, prices:s.prices, excluded:s.excluded, used:s.used,
    vehicles:s.vehicles, licenseRules:s.licenseRules, energy:s.energy, cases:s.cases, plans:s.plans, history:s.history});
}
function downloadJson(name, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const stamp = () => today().replace(/\./g, '');
function exportAll(){
  downloadJson(`부대차량구매도우미_전체_${stamp()}.json`, exportPayload('all'));
  state.meta.lastBackup = new Date().toISOString(); save(); toast('전체 데이터를 JSON 파일로 내보냈습니다.');
}
function exportVehicles(){ downloadJson(`부대차량구매도우미_차량DB_${stamp()}.json`, exportPayload('vehicles')); toast('차량 DB를 JSON 파일로 내보냈습니다.'); }
function mergeById(local, incoming, replace){
  const out = local.slice();
  for (const it of incoming || []) {
    if (!it || typeof it !== 'object') continue;
    const i = out.findIndex(x => x.id === it.id);
    if (i < 0) out.push(it); else if (replace) out[i] = it;
  }
  return out;
}
function importData(text, mode){
  let d;
  try { d = JSON.parse(text); } catch (e) { throw new Error('JSON 형식이 아닙니다.'); }
  if (!d || typeof d.schemaVersion !== 'number') throw new Error('이 도구의 파일이 아닙니다 (schemaVersion 없음).');
  if (d.schemaVersion > SCHEMA_VERSION) throw new Error(`더 새 버전(schemaVersion ${d.schemaVersion})의 파일입니다. 최신 도구로 여세요.`);
  const vehiclesOnly = d.type === 'vehicles';
  if (mode === 'overwrite') {
    if (vehiclesOnly) state.vehicles = Array.isArray(d.vehicles) ? d.vehicles : state.vehicles;
    else { const meta = state.meta; state = normalize(d); state.meta = meta; }
  } else {
    state.vehicles = mergeById(state.vehicles, d.vehicles, true);
    if (!vehiclesOnly) {
      state.cases = mergeById(state.cases, d.cases, false);
      state.plans = mergeById(state.plans, d.plans, false);
      state.history = mergeById(state.history, d.history, false);
    }
  }
  save();
  return vehiclesOnly ? `차량 DB ${(d.vehicles || []).length}대` : '전체 데이터';
}
function importFile(input){
  const f = input.files && input.files[0]; if (!f) return;
  const mode = $('#impMode').value;
  if (mode === 'overwrite' && !confirm('덮어쓰기는 현재 데이터를 파일 내용으로 교체합니다. 계속할까요?')) { input.value = ''; return; }
  const rd = new FileReader();
  rd.onload = () => {
    try { const what = importData(rd.result, mode); render(); toast(`${what}를 가져왔습니다 (${mode === 'merge' ? '병합' : '덮어쓰기'}).`); }
    catch (e) { toast('가져오기 실패: ' + e.message); }
    input.value = '';
  };
  rd.onerror = () => toast('파일을 읽지 못했습니다.');
  rd.readAsText(f, 'utf-8');
}

/* 입력 바인딩: data-k 경로에 값을 저장하고 자동 저장 */
function setPath(path, val){
  const ks = path.split('.'); let o = state;
  for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; }
  o[ks[ks.length - 1]] = val;
}
function readVal(el){
  const t = el.dataset.t;
  if (t === 'bool') return el.checked;
  if (t === 'bool01') return el.value === '1';
  if (t === 'num') return el.value === '' ? 0 : num(el.value);
  if (t === 'numnull') return el.value === '' ? null : num(el.value);
  return el.value;
}
function onBound(e){
  const el = e.target, k = el.dataset && el.dataset.k;
  if (!k) return;
  const isChoice = el.tagName === 'SELECT' || el.type === 'checkbox';
  if ((e.type === 'input') === isChoice) return; // 선택형은 change, 입력형은 input 이벤트만 처리
  if (k === 'cond.perUnitBudget') state.cond.perUnitOverride = true;
  setPath(k, readVal(el));
  save();
  if (el.dataset.rerender) { render(); return; }
  if (k.startsWith('profile.licenses')) { const b = $('#licBar'); if (b) b.innerHTML = licenseBar(); }
  if ((k === 'cond.qty' || k === 'profile.totalBudget') && !state.cond.perUnitOverride) {
    const pu = $('#perUnit'); if (pu) pu.value = perUnitBudget();
    const h = $('#perUnitHint'); if (h) h.textContent = `총예산 ${fmt(state.profile.totalBudget)}만 원 ÷ ${state.cond.qty}대 자동 계산`;
  }
  if (k === 'cond.perUnitBudget') { const h = $('#perUnitHint'); if (h) h.innerHTML = '직접 수정함 · <a href="#" onclick="resetPerUnit();return false">자동 계산으로</a>'; }
  if (k.startsWith('weights.')) { const id = k.split('.')[1]; $('#wv-' + id).textContent = num(state.weights[id]) + '%'; $('#wsum').innerHTML = weightSumHtml(); }
  const live = $('#live'); if (live) live.innerHTML = liveSummary();
}
document.addEventListener('input', onBound);
document.addEventListener('change', onBound);

renderNav(); render(); updateTopbar();
</script>
