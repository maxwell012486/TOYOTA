<title>내 차 결정 도우미</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f2f4f6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: infographic slides — big centered numbered title, rounded panels with a tinted title band (mint = good, peach = caution), check / cross icons, dotted paper. */
:root{
  --paper:#f4f6f7; --dotc:rgba(25,31,40,.06); --surface:#ffffff; --sunk:#f5f6f8; --ink:#1d232b; --muted:#646e7a; --line:#e5e8eb; --line-strong:#d1d6db;
  --accent:#17867a; --accent-ink:#0f6c62; --accent-soft:rgba(23,134,122,.10); --on-accent:#ffffff;
  --mint-band:#dcf0ea; --mint-line:#a9d9cc; --mint-ink:#156b5f;
  --peach-band:#fbe5d5; --peach-line:#f0c3a2; --peach-ink:#9a4a17;
  --neutral-band:#eef1f4; --neutral-line:#d7dde3;
  --c0:#2563eb; --c1:#e8710a; --c2:#0f9f62; --c3:#7c4dda;
  --warn:#a35200; --warn-bg:#fff4e5; --good:#0b7d4d; --bad:#d63b2f;
  --shadow:0 1px 2px rgba(25,31,40,.04),0 2px 8px rgba(25,31,40,.04);
  --card-border:transparent;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111417; --dotc:rgba(255,255,255,.05); --surface:#1b1f24; --sunk:#252a30; --ink:#eceef1; --muted:#9aa3ae; --line:#2e333b; --line-strong:#3b414a;
    --accent:#3cc7b4; --accent-ink:#62d6c6; --accent-soft:rgba(60,199,180,.14); --on-accent:#06231f;
    --mint-band:rgba(60,199,180,.16); --mint-line:rgba(60,199,180,.42); --mint-ink:#7fe0d2;
    --peach-band:rgba(245,150,90,.16); --peach-line:rgba(245,150,90,.42); --peach-ink:#ffb88a;
    --neutral-band:#252a30; --neutral-line:#3b414a;
    --c0:#6aa1ff; --c1:#ff9a42; --c2:#2fcf8a; --c3:#a98bf5;
    --warn:#ffb867; --warn-bg:#3a2a13; --good:#4ddb9c; --bad:#ff7a6e;
    --shadow:none; --card-border:#2a2f37;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111417; --dotc:rgba(255,255,255,.05); --surface:#1b1f24; --sunk:#252a30; --ink:#eceef1; --muted:#9aa3ae; --line:#2e333b; --line-strong:#3b414a;
  --accent:#3cc7b4; --accent-ink:#62d6c6; --accent-soft:rgba(60,199,180,.14); --on-accent:#06231f;
  --mint-band:rgba(60,199,180,.16); --mint-line:rgba(60,199,180,.42); --mint-ink:#7fe0d2;
  --peach-band:rgba(245,150,90,.16); --peach-line:rgba(245,150,90,.42); --peach-ink:#ffb88a;
  --neutral-band:#252a30; --neutral-line:#3b414a;
  --c0:#6aa1ff; --c1:#ff9a42; --c2:#2fcf8a; --c3:#a98bf5;
  --warn:#ffb867; --warn-bg:#3a2a13; --good:#4ddb9c; --bad:#ff7a6e;
  --shadow:none; --card-border:#2a2f37;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--paper);background-image:radial-gradient(var(--dotc) 1.2px,transparent 1.2px);background-size:18px 18px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;letter-spacing:-.01em;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* header: title + progress */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.top .wrap{padding-block:12px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.brand > div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand b{font-weight:800;font-size:17px;letter-spacing:-.02em}
.brand small{color:var(--muted);font-size:12.5px;margin-left:8px}
.icon-btn{border:0;background:var(--sunk);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;color:var(--muted);flex:none}
.brand-btns{display:flex;gap:6px;flex:none}
.home-body{padding:16px 18px 18px;display:grid;gap:12px;font-size:14px}
.home-body p{margin:0}
.ex{display:flex;gap:8px;align-items:flex-start;background:var(--sunk);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;line-height:1.5}
.ex-tag{flex:none;font-size:11.5px;font-weight:800;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:1px 8px;margin-top:1px}
.home-btns{display:grid;gap:8px}
.home-btns .btn{padding:12px;font-size:14.5px}
.report{width:100%;min-height:360px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;background:var(--sunk)}
.budget-warn{font-size:12px;font-weight:700;color:var(--bad)}
.budget-ok{font-size:12px;font-weight:700;color:var(--good)}
.progress{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .25s ease}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;list-style:none;margin:0;padding:0}
.steps button{width:100%;border:0;background:transparent;border-radius:999px;padding:6px 0;font-size:13px;font-weight:500;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px}
.steps .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--line);color:var(--muted);font-size:11px;font-weight:700}
.steps button.done .n{background:var(--accent-soft);color:var(--accent-ink)}
.steps button[aria-current="step"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.steps button[aria-current="step"] .n{background:var(--accent);color:var(--on-accent)}

main .wrap{padding-block:16px calc(104px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}

/* infographic panels: centered numbered title, panel with tinted title band */
.cover{text-align:center;padding:10px 4px 6px}
h1.h{font-weight:800;font-size:25px;line-height:1.3;margin:0;letter-spacing:-.04em;text-wrap:balance}
.lede{margin:8px auto 0;color:var(--muted);font-size:14px;max-width:30em;text-wrap:balance}
.card,.tbl-card,.panel{--band:var(--mint-band);--band-line:var(--mint-line);background:var(--surface);border:1.5px solid var(--band-line);border-radius:20px;overflow:hidden}
.peach{--band:var(--peach-band);--band-line:var(--peach-line)}
.neutral{--band:var(--neutral-band);--band-line:var(--neutral-line)}
.card{padding:0 18px 18px}
.card > h2:first-child,.tbl-card > h2:first-child,.panel > .band{margin:0 -18px 16px;padding:12px 16px;background:var(--band);border-bottom:1.5px solid var(--band-line);text-align:center;font-size:16.5px;font-weight:800;letter-spacing:-.03em}
.tbl-card > h2:first-child,.panel > .band{margin:0 0 4px}
h2{font-size:17px;margin:0 0 4px;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
h2 .sub{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin:2px 0 0;letter-spacing:-.01em}
/* check / cross icons */
.ico{flex:none;position:relative;display:inline-block;width:22px;height:22px;border:2px solid var(--ink);border-radius:50%;margin-top:1px}
.ico.ok::after{content:"";position:absolute;left:6px;top:2.5px;width:5px;height:9px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.ico.no::before,.ico.no::after{content:"";position:absolute;left:4px;top:8px;width:10px;height:2px;background:var(--ink);border-radius:1px;transform:rotate(45deg)}
.ico.no::after{transform:rotate(-45deg)}
.items{list-style:none;margin:0;padding:10px 16px 16px;display:grid;gap:12px}
.items li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:14px;line-height:1.55}
.items li b{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em;margin-bottom:1px}
.sec-title{font-size:15px;font-weight:800;margin:12px 4px 0;color:var(--ink)}
.sec-title .sub{font-weight:500;color:var(--muted);font-size:12.5px;margin-left:6px}
.car-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 4px 0}
.car-head h3{margin:0;font-size:16px;font-weight:800;display:flex;align-items:center;letter-spacing:-.03em}
.pc-pair{display:grid;gap:10px}
@media (min-width:560px){.pc-pair{grid-template-columns:1fr 1fr}}
.note{color:var(--muted);font-size:12.5px;margin:10px 2px 0;line-height:1.55}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cc);margin-right:6px;vertical-align:1px;flex:none}
.cc0{--cc:var(--c0);--ct:rgba(37,99,235,.12)} .cc1{--cc:var(--c1);--ct:rgba(232,113,10,.13)} .cc2{--cc:var(--c2);--ct:rgba(15,159,98,.12)} .cc3{--cc:var(--c3);--ct:rgba(124,77,218,.12)}

/* step 1: car cards */
.cars{display:grid;grid-auto-flow:column;grid-auto-columns:calc(50% - 5px);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 0 4px}
.car{scroll-snap-align:start;min-width:0;background:var(--surface);border:1.5px solid var(--neutral-line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.car img,.photo{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--sunk);max-width:100%}
.car .body{padding:12px 14px 14px;display:grid;gap:10px;flex:1}
.car .tag-car{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;color:var(--cc);background:var(--ct);border-radius:999px;padding:2px 8px;justify-self:start}
.car .nm{font-weight:700;font-size:15px;line-height:1.35;margin-top:6px}
.car .meta{color:var(--muted);font-size:12px}
.car .credit{color:var(--muted);font-size:10.5px;opacity:.8}
.quote{display:grid;gap:3px;font-size:12.5px;color:var(--muted)}
.quote div{display:flex;justify-content:space-between;gap:6px}
.quote .num{color:var(--ink)}
.quote .disc .num{color:var(--good)}
.quote .final{margin-top:6px;padding-top:8px;border-top:1px solid var(--line);align-items:baseline;color:var(--ink);font-weight:500}
.quote .final b{font-size:18px;font-weight:800;color:var(--cc);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:10px 14px;font-size:14px;font-weight:500;transition:background .15s}
.btn:hover{background:var(--sunk)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.soft{background:var(--sunk);border-color:transparent}
.btn.danger{color:var(--bad);border-color:rgba(214,59,47,.35);background:transparent}
.btn.wide{width:100%}
.add{border:1.5px dashed var(--line-strong);background:transparent;border-radius:var(--r);padding:14px;color:var(--accent-ink);font-weight:700;width:100%}
.tbl-card{padding:0 0 4px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:11px 16px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr:last-child th,tr:last-child td{border-bottom:0}
th[scope=row]{text-align:left;font-weight:500;color:var(--muted)}
thead th{font-size:12.5px;color:var(--ink);font-weight:700}
td.win{font-weight:700;color:var(--cc)}
td.win::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cc);margin-left:5px;vertical-align:2px}
td.txt{white-space:normal;min-width:7em;font-size:12.5px}
tr.total th,tr.total td{font-weight:800;color:var(--ink);background:var(--accent-soft);font-size:14.5px}
.pc{padding:18px 20px;display:grid;gap:12px}
.pc h3{margin:0;font-size:15px;display:flex;align-items:center}
.pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pc-grid > div{min-width:0}
.pc ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13.5px;line-height:1.5}
.pc li{position:relative;padding-left:14px}
.pc li::before{content:"";position:absolute;left:2px;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--line-strong)}
.pc .plus-list li::before{background:var(--good)} .pc .minus-list li::before{background:var(--bad)}
.lbl{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
.lbl.plus{color:var(--good)} .lbl.minus{color:var(--bad)}
@media (max-width:380px){.pc-grid{grid-template-columns:1fr}}

/* step 2: sliders, linear scale */
.slider-row{display:grid;grid-template-columns:4.4em 1fr 3.4em;align-items:center;gap:12px;padding:6px 0}
.slider-row label{font-weight:500;font-size:14px}
.slider-row output{text-align:center;font-size:13.5px;font-weight:700;background:var(--sunk);border-radius:8px;padding:3px 0;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:28px;margin:0}
.sumbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk);margin-top:14px;gap:2px}
.sumbar span{display:block;height:100%}
.sumtxt{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-top:8px;color:var(--muted)}
.sumtxt b{font-size:13px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;margin-top:10px}
.crit{padding:16px 0;border-top:1px solid var(--line);display:grid;gap:10px}
.crit:first-of-type{border-top:0;padding-top:0}
.crit h3{margin:0;font-size:15px;font-weight:700}
.crit h3 .req{color:var(--accent-ink);margin-left:2px}
.crit p{margin:-6px 0 0;color:var(--muted);font-size:12.5px}
.scale-row{display:grid;gap:6px}
.scale-row .who{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:500}
.scale-row .who output{font-weight:800;color:var(--cc);font-variant-numeric:tabular-nums}
.scale{position:relative;display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label{height:36px;display:grid;place-items:center;border-radius:10px;background:var(--sunk);font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums;transition:background .12s,color .12s}
.scale input:checked + label{background:var(--cc);color:var(--surface)}
.scale input:focus-visible + label{outline:2px solid var(--cc);outline-offset:1px}
.scale-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.live{display:flex;flex-wrap:wrap;gap:10px}
.live span{flex:1 1 40%;background:var(--ct);border-radius:var(--r-sm);padding:10px 12px;display:grid;gap:2px;font-size:12.5px;color:var(--muted)}
.live b{font-size:22px;font-weight:800;color:var(--cc);line-height:1.2;font-variant-numeric:tabular-nums}
textarea,input[type=text],input[type=number],input[type=url],input[type=email],select{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:var(--r-sm);padding:12px 14px;font-size:15px;min-height:48px;transition:border-color .15s,background .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=url]:focus,input[type=email]:focus,select:focus{outline:none;border-color:var(--accent);background-color:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
::placeholder{color:var(--muted);opacity:.7}
textarea{min-height:84px;resize:vertical}
.field{display:grid;gap:6px}
.field > span{font-size:13.5px;font-weight:700}
.field small{color:var(--muted);font-size:12px;font-weight:400}
.fields{display:grid;gap:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two > *{min-width:0}

/* step 3 */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.days label{display:grid;gap:4px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);min-width:0}
.days input{text-align:center;padding:10px 0;font-size:14px;font-weight:500;min-height:44px}
.kmline{display:flex;justify-content:space-between;font-size:13.5px;background:var(--sunk);border-radius:var(--r-sm);padding:10px 14px;color:var(--muted)}
.kmline b{color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:12px 10px;text-align:center;font-size:14px;font-weight:500;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);cursor:pointer}
.seg input:checked + label{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:700;box-shadow:inset 0 0 0 1px var(--accent)}
.seg input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.chartbox{position:relative;height:240px}
.insight{background:var(--accent-soft);border-radius:var(--r-sm);padding:12px 14px;font-size:14px;display:grid;gap:8px;margin-top:14px}
.insight p{margin:0}
.insight b{color:var(--accent-ink)}

/* step 4: share card */
.share{background-color:var(--paper);background-image:radial-gradient(var(--dotc) 1.2px,transparent 1.2px);background-size:18px 18px;border:1.5px solid var(--neutral-line);border-radius:22px;padding:22px 16px 16px;display:grid;gap:14px;overflow:hidden}
.share .sc-top{text-align:center}
.share .sc-photo{background:var(--surface);border:1.5px solid var(--neutral-line);border-radius:20px;overflow:hidden}
.share .radar-panel{padding:10px 8px 8px}
.share .panel .items{padding-top:12px}
.eyebrow{font-size:12px;color:var(--muted);font-weight:500}
.verdict{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--cc);background:var(--ct);border-radius:999px;padding:3px 10px;margin-top:10px}
.sc-head{font-weight:800;font-size:30px;line-height:1.25;letter-spacing:-.045em;margin:8px 0 0;text-wrap:balance}
.sc-head em{font-style:normal;color:var(--cc)}
.sc-vs{display:flex;gap:8px;margin-top:12px}
.sc-vs > span{flex:1;background:var(--ct);border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px;color:var(--muted);display:grid}
.sc-vs b{font-size:24px;font-weight:800;color:var(--cc);line-height:1.2;font-variant-numeric:tabular-nums}
.sc-vs b small{font-size:13px;font-weight:700;margin-left:1px}
.share .photo{border-radius:14px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,5.5em) 1fr 3.2em;gap:8px;align-items:center;font-size:13px}
.bar .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--cc);border-radius:4px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.radar{position:relative;height:250px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1.5px solid var(--neutral-line);border-radius:16px;padding:12px 10px;display:grid;gap:3px;min-width:0}
.kpi .k{font-size:11.5px;color:var(--muted)}
.kpi .v{font-weight:800;font-size:17px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-size:11px;font-weight:500;margin-left:1px}
.kpi .s{font-size:11.5px;font-weight:700}

<script>
(function(){

/* ---------- 기본 데이터 (PRD 7장) ---------- */
const KEY = 'carDecision.v2', KEY_V1 = 'carDecision.v1';

/* 용도별 평가 기준. 가격·연비는 계산으로, 나머지는 1~10점 직접 채점 */

  ]
};
const MODES = {

};
const ACQ_RATE = 0.07;          // 취득세 7%
const TAX_END_2027 = 106;       // 개소세 감면 종료분(만 원): 개소세 70 + 교육세 21 + 부가세 9.1 + 취득세 6.4
const CAR_HEX = ['#1f63c9','#dd6a10','#1d8657','#7650c4'];

/* 예제 1: 우리 집 차 고르기 (직접 작성한 CAMRY vs RAV4 결정) */
function defaultsFamily(){

       price:4843, discount:400, fuel:17.1, power:'224~225마력', drive:'전륜(FWD)',
       powertrain:'2.5L 하이브리드, e-CVT', length:4920, width:1840, height:1445, wheelbase:2825, photo:'',
       pros:['할인 400만 원으로 실구매가가 약 450만 원 낮음','세단 특유의 낮은 무게중심과 안정적인 고속 승차감 (금·일 67km 구간에 유리)','오너 평가 연비 만족도 높음','아내 차(SUV)와 차종이 겹치지 않아 가족 차량 구성이 다양해짐'],

       scores:{design:7, durability:9, pref:7}},
      {id:'rav4', name:'RAV4 XLE HEV 2WD', short:'RAV4', year:'2026', color:1, body:'SUV',
       price:4990, discount:100, fuel:19.0, power:'186 (단위 확인 필요)', drive:'전륜(2WD)',
       powertrain:'2.5L 하이브리드', length:4600, width:1855, height:1680, wheelbase:2690, photo:'',
       pros:['공인 복합연비 19.0km/L로 더 우수','높은 시야와 편한 승하차 (지금 몸에 익은 장점)','6세대 풀체인지 신형 디자인','짧은 전장으로 마트·학원 주차가 편함'],

    ],

  };
}

/* 예제 2: 부대·기관 업무차량 선정 (가상 예시 데이터) */
function defaultsOrg(){
  const f = defaultsFamily();
  const [camry, rav4] = f.cars;
  return {
    v:2, mode:'org', step:1, years:7, taxMode:'exempt',
    org:{dept:'OO대대 행정보급실 (예시)', purpose:'보급품 수령·업무 연락·출장', budget:5000, years:7},
    cars:[
      {...camry, discount:0,
       pros:['7년 총소유비용이 RAV4와 비슷한 수준 (차량가가 147만 원 낮음)','장거리 출장 때 승차감과 정숙성이 좋음','의전·업무 연락용으로 쓰기 좋음'],
       cons:['적재공간이 SUV보다 작아 보급품 운반에 불리','지상고가 낮아 비포장·야지 진입에 한계','연비가 RAV4보다 낮아 주행이 많을수록 연료비 부담'],
       scores:{perf:6, maint:8, safety:8}},
      {...rav4, discount:0,
       pros:['높은 지상고와 넓은 적재공간으로 보급품·장비 운반에 유리','연비가 좋아 연 주행이 많을수록 유리','승하차가 편해 잦은 탑승·하차에 적합'],
       cons:['차량가가 147만 원 높음','2WD라 험로 주행에는 한계','고속 장거리 정숙성은 세단보다 떨어질 수 있음'],
       scores:{perf:9, maint:8, safety:8}}
    ],
    weights:{price:30, fuel:25, perf:20, maint:15, safety:10},
    km:{mon:70, tue:70, wed:70, thu:70, fri:70, sat:0, sun:0},
    gas:1858, region:'', bondRate:12, bondDisc:6, delivery:'2026',
    memo:{wife:'', kids:'', author:'보급품 운반이 잦아 적재공간과 연비를 중요하게 봤습니다. (예시)', reviewer:'예산 한도 이내이며, 정비는 인근 공식 서비스센터 이용 가능 여부를 확인하기 바람. (예시)'},
    updatedAt:''
  };
}

/* 빈 양식: 후보 2대만 두고 직접 채운다 */
function blankFor(mode){
  const base = mode === 'org' ? defaultsOrg() : defaultsFamily();
  const manual = CRITS[mode].filter(c=>!c.auto).map(c=>c.k);
  const car = (id, name, short, color, body) => ({id, name, short, year:'2026', color, body, price:0, discount:0, fuel:0, power:'', drive:'', powertrain:'',
    length:0, width:0, height:0, wheelbase:0, photo:'', pros:[], cons:[], scores:Object.fromEntries(manual.map(k=>[k,5]))});
  return {...base, step:1,
    org: mode === 'org' ? {dept:'', purpose:'', budget:0, years:5} : base.org,
    years: mode === 'org' ? 5 : 5,
    cars:[car('carA','차량 A','A안',0,'세단'), car('carB','차량 B','B안',1,'SUV')],
    memo:{wife:'', kids:'', author:'', reviewer:''}, region:'', updatedAt:''};
}
const defaultsFor = mode => mode === 'org' ? defaultsOrg() : defaultsFamily();
const crit = (s=state) => CRITS[s.mode] || CRITS.family;
const M = () => MODES[state.mode] || MODES.family;
const holdYears = s => s.mode === 'org' ? clamp(Math.round(num(s.org.years,5)),1,20) : 5;

/* ---------- 유틸 ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v,d=0)=>{ const n = parseFloat(String(v).replace(/,/g,'')); return isFinite(n) ? n : d; };
const r1 = n => Math.round(n*10)/10;
const f1 = n => r1(n).toLocaleString('ko-KR',{minimumFractionDigits:1, maximumFractionDigits:1});
const f0 = n => Math.round(n).toLocaleString('ko-KR');
const fm = n => (Math.abs(r1(n) - Math.round(n)) < 1e-9 ? f0(n) : f1(n));   // 만 원 표기
const clamp = (n,a,b)=>Math.min(b,Math.max(a,n));
function batchim(w){
  w = String(w).trim(); const ch = w[w.length-1] || ''; const c = ch.charCodeAt(0);
  if (c>=0xAC00 && c<=0xD7A3) return (c-0xAC00)%28 !== 0;
  if (/[0-9]/.test(ch)) return '013678'.includes(ch);
  if (/[a-zA-Z]/.test(ch)) return 'lmnrLMNR'.includes(ch);
  return false;
}
const iga = w => w + (batchim(w) ? '이' : '가');
const eunneun = w => w + (batchim(w) ? '은' : '는');
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
function rgba(hex,a){
  const h = hex.replace('#',''); if (h.length !== 6) return hex;
  return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;
}
const carColor = c => cssVar('--c'+c.color) || CAR_HEX[c.color];

/* ---------- 상태 / 저장 ----------
   store = { mode, view:'home'|'flow', family:결정, org:결정 }  ·  state = 지금 보고 있는 용도의 결정 */
let store = loadStore();
let state = store[store.mode];
function normalizeStore(obj){
  if (obj && (obj.family || obj.org)){
    const mode = obj.mode === 'org' ? 'org' : 'family';
    return { mode, view: obj.view === 'home' ? 'home' : 'flow',
      family: merge(defaultsFamily(), obj.family || {}), org: obj.org ? merge(defaultsOrg(), obj.org) : defaultsOrg(),
      updatedAt: obj.updatedAt || '' };
  }
  if (obj && Array.isArray(obj.cars)){ // 예전(v1) 형식: 우리 집 차 결정 하나만 있던 데이터
    const family = merge(defaultsFamily(), obj); family.mode = 'family';
    return { mode:'family', view:'flow', family, org: defaultsOrg(), updatedAt: obj.updatedAt || '' };
  }
  return { mode:'family', view:'home', family: defaultsFamily(), org: defaultsOrg(), updatedAt:'' };
}
function setMode(mode){ store.mode = mode; state = store[mode]; }
function merge(base, src){
  if (!src || typeof src !== 'object') return base;
  const out = {...base};
  for (const k of Object.keys(base)){
    if (!(k in src)) continue;
    if (k === 'cars') continue;
    const b = base[k], s = src[k];
    if (b && typeof b === 'object' && !Array.isArray(b)) out[k] = merge(b, s);
    else if (typeof s === typeof b) out[k] = s;
  }
  if (Array.isArray(src.cars) && src.cars.length >= 2){
    out.cars = src.cars.slice(0,4).map((c,i)=>{
      const tmpl = base.cars[i] || base.cars[0];
      const car = {...tmpl, ...c, scores:{...tmpl.scores, ...(c.scores||{})}};
      car.pros = Array.isArray(c.pros) ? c.pros.map(String) : [];
      car.cons = Array.isArray(c.cons) ? c.cons.map(String) : [];
      car.color = clamp(Math.round(num(c.color, i)),0,3);
      if (!car.id) car.id = 'car'+Date.now()+i;
      return car;
    });
  }
  return out;
}
function loadStore(){
  try {
    const raw = localStorage.getItem(KEY) || localStorage.getItem(KEY_V1);
    if (raw) return normalizeStore(JSON.parse(raw));
  } catch(e){}
  return normalizeStore(null);
}
let saveTimer = 0, cardDirty = true;
function save(){
  cardDirty = true;
  state.updatedAt = store.updatedAt = new Date().toISOString();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveLocal, 250);
  schedulePush();
}
function saveLocal(){
  try { localStorage.setItem(KEY, JSON.stringify(store)); }
  catch(e){ toast('휴대폰 저장 공간이 부족해 자동 저장하지 못했어요. 백업을 내보내 두세요.'); }
}

/* ---------- 클라우드 저장 (Supabase, 로그인한 사람만) ---------- */
// Vercel 빌드가 자리표시자를 채운다. 비어 있거나 라이브러리가 없으면 기능을 숨긴다.
const CLOUD = { url:'__SUPABASE_URL__', key:'__SUPABASE_PUBLISHABLE_KEY__' };
const cloudOn = !CLOUD.url.startsWith('__') && !CLOUD.key.startsWith('__') && !!(window.supabase && window.supabase.createClient);
let sb = null, cloudUser = null, cloudMsg = '', pushTimer = 0, linkSent = '';
function schedulePush(){
  if (!sb || !cloudUser) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>{ pushNow().catch(()=>{}); }, 2000);
}
async function pushNow(){
  if (!sb || !cloudUser) return false;
  const { error } = await sb.from('car_decisions').upsert({ user_id: cloudUser.id, state: store, updated_at: store.updatedAt || new Date().toISOString() });
  const t = new Date();
  cloudMsg = error ? '클라우드 저장에 실패했어요. 인터넷 연결을 확인해 주세요.' : `클라우드에 저장됨 · ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
  refreshCloudUI();
  return !error;
}
async function pullNow(force){
  if (!sb || !cloudUser) return;
  const { data, error } = await sb.from('car_decisions').select('state, updated_at').eq('user_id', cloudUser.id).maybeSingle();
  if (error){ cloudMsg = '클라우드에서 불러오지 못했어요.'; refreshCloudUI(); return; }
  const remoteNewer = data && data.state && (force || !store.updatedAt || new Date(data.updated_at) > new Date(store.updatedAt));
  if (remoteNewer){
    store = normalizeStore(data.state); store.updatedAt = data.updated_at; setMode(store.mode);
    saveLocal(); cardDirty = true; render();
    cloudMsg = '클라우드에 저장된 내용을 불러왔어요.'; toast(cloudMsg);
    refreshCloudUI();
  } else {
    await pushNow();
  }
}
function cloudHTML(){

/* ---------- 계산 (PRD 8장) ---------- */
function compute(s){
  const weekKm = DAYS.reduce((a,[k])=>a + Math.max(0,num(s.km[k])),0);
  const annualKm = weekKm * 52;
  const gas = Math.max(0, num(s.gas));
  const extra = s.delivery === '2027' ? TAX_END_2027 : 0;
  const exempt = s.taxMode === 'exempt';   // 국가·지자체 취득은 취득세 비과세, 공채 매입 없음
  const Y = holdYears(s);
  const years = [...new Set([1,5,10,20,Y])].sort((a,b)=>a-b);
  const cs = crit(s);
  const cars = s.cars.map(c=>{
    const net = num(c.price) - num(c.discount);
    const base = net / 1.1;
    const acq = exempt ? 0 : base * ACQ_RATE;
    const bond = exempt ? 0 : base * num(s.bondRate)/100;
    const bondLoss = bond * num(s.bondDisc)/100;
    const total = net + acq + bondLoss + extra;
    const fuel = num(c.fuel);
    const fuelCost = fuel > 0 ? annualKm / fuel * gas / 10000 : 0;
    const cum = Object.fromEntries(years.map(y=>[y, total + fuelCost*y]));
    return {car:c, net, base, acq, bond, bondLoss, extra, total, fuel, fuelCost, cum};
  });
  const minY = Math.min(...cars.map(x=>x.cum[Y]));
  const maxFuel = Math.max(...cars.map(x=>x.fuel), 0.0001);
  const w = s.weights; const wsum = cs.reduce((a,c)=>a + Math.max(0,num(w[c.k])),0);
  cars.forEach(x=>{
    const pct = minY > 0 ? (x.cum[Y]-minY)/minY*100 : 0;
    x.pctY = pct;
    x.s = { price: Math.max(1, 10 - 0.5*pct), fuel: 10 * x.fuel / maxFuel };
    cs.filter(c=>!c.auto).forEach(c=>{ x.s[c.k] = clamp(num((x.car.scores||{})[c.k],5),1,10); });
    x.score = wsum > 0 ? cs.reduce((a,c)=>a + x.s[c.k]*Math.max(0,num(w[c.k])),0) / wsum * 10 : 0;
  });
  const ranked = [...cars].sort((a,b)=>b.score - a.score);
  return {cars, ranked, weekKm, annualKm, gas, wsum, extra, exempt, Y, years};
}

function reasons(rec, rival, R){
  const w = state.weights, Y = R.Y;
  const taxNote = R.exempt ? '취득세 면제 기준' : '취득세·공채 포함';
  const contrib = crit().map(c=>({c, d: Math.max(0,num(w[c.k]))/(R.wsum||1) * (rec.s[c.k]-rival.s[c.k])}));
  const fav = contrib.filter(x=>x.d > 1e-4).sort((a,b)=>b.d-a.d);
  const unf = contrib.filter(x=>x.d < -1e-4).sort((a,b)=>a.d-b.d);
  const rn = rival.car.short || rival.car.name;
  const lines = fav.slice(0,3).map(({c})=>{
    let t;
    if (c.k==='price') t = `${Y}년 총비용이 ${fm(rival.cum[Y]-rec.cum[Y])}만 원 적게 듭니다 (${taxNote}).`;
    else if (c.k==='fuel') t = `연비가 ${f1(rec.fuel-rival.fuel)}km/L 좋아 1년 연료비가 ${f1(rival.fuelCost-rec.fuelCost)}만 원 줄어듭니다.`;
    else if (c.k==='pref') t = `직접 타본 느낌(승하차·시야·승차감)에서 더 높은 점수를 받았습니다 (${fm(rec.s.pref)}점 대 ${fm(rival.s.pref)}점).`;
    else t = `${c.label} 점수에서 ${fm(rec.s[c.k])}점 대 ${fm(rival.s[c.k])}점으로 앞섭니다.`;
    return {tag:c.label, text:t, trade:false};
  });
  for (const {c} of unf){
    if (lines.length >= 3) break;
    let t;
    if (c.k==='price') t = `반대로 ${c.topic} ${iga(rn)} 낫습니다. ${Y}년 총비용이 ${fm(rec.cum[Y]-rival.cum[Y])}만 원 적어요.`;
    else if (c.k==='fuel') t = `반대로 연비는 ${iga(rn)} 낫습니다. 1년 연료비가 ${f1(rec.fuelCost-rival.fuelCost)}만 원 적어요.`;
    else t = `반대로 ${c.topic} ${iga(rn)} 낫습니다 (${fm(rival.s[c.k])}점 대 ${fm(rec.s[c.k])}점).`;
    lines.push({tag:c.label, text:t, trade:true});
  }
  const tied = contrib.filter(x=>Math.abs(x.d) <= 1e-4 && num(w[x.c.k]) > 0 && !x.c.auto).map(x=>x.c);
  if (lines.length < 3 && tied.length){
    const gap = rec.score - rival.score;
    const perPt = Math.max(...tied.map(c=>num(w[c.k]))) / (R.wsum||1) * 10;
    const names = tied.map(c=>c.label).join('·');
    const t = gap > 0.05 && perPt > 0
      ? `${eunneun(names)} 두 차 점수가 같습니다. ${iga(rn)} 뒤집으려면 이 항목들에서 합계 약 ${Math.ceil(gap/perPt)}점이 더 필요해요.`
      : `${eunneun(names)} 두 차 점수가 같습니다.`;
    lines.push({tag:'동점', text:t, trade:true});
  }
  return lines;
}

/* 연비로 가격 차이를 따라잡는 데 걸리는 해 */
function catchUps(R){
  const base = [...R.cars].sort((a,b)=>a.total-b.total)[0];
  const bn = base.car.short || base.car.name;
  return R.cars.filter(x=>x!==base).map(x=>{
    const xn = x.car.short || x.car.name;
    const gap = x.total - base.total, save = base.fuelCost - x.fuelCost;
    if (save <= 0.05) return `${eunneun(xn)} ${bn}보다 사는 값도 ${fm(gap)}만 원 비싸고 연료비도 적지 않아, 시간이 지나도 차이가 줄지 않습니다.`;
    const yrs = gap / save;
    let t = `${iga(xn)} 연비로 가격 차이(${fm(gap)}만 원)를 따라잡는 데 <b>약 ${f0(yrs)}년</b>이 걸립니다. 연비 이득은 연 ${f1(save)}만 원입니다.`;
    const manual = crit().filter(c=>!c.auto).map(c=>c.label).join('·');
    if (yrs > 20) t += ` 20년을 타도 따라잡지 못하니, 결론을 바꾸는 변수는 ${manual} 점수입니다.`;
    else if (state.mode === 'org' && yrs > R.Y) t += ` 보유 기간(${R.Y}년) 안에는 따라잡지 못합니다.`;
    return t;
  });
}

}
const illusCache = {};
const illusKey = c => (c.body === 'SUV' ? 'suv' : 'sedan') + c.color;
function illusSrc(c){
  const k = illusKey(c);
  return illusCache[k] || 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(illusSVG(c.body==='SUV'?'suv':'sedan', CAR_HEX[c.color]));
}
function rasterizeAll(){
  const jobs = [];
  for (const kind of ['sedan','suv']) for (let i=0;i<4;i++){
    const k = kind + i;
    const src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(illusSVG(kind, CAR_HEX[i]));
    jobs.push(new Promise(res=>{
      const img = new Image();
      img.onload = ()=>{ try{ const cv = document.createElement('canvas'); cv.width=800; cv.height=450; cv.getContext('2d').drawImage(img,0,0,800,450); illusCache[k] = cv.toDataURL('image/png'); }catch(e){} res(); };
      img.onerror = ()=>res();
      img.src = src;
    }));
  }
  return Promise.all(jobs);
}

/* 화면 문장(~습니다/~요)을 보고서 문체(~음/~함)로 바꾼다 */
function formal(t){
  return t.replace(/앞섭니다\./g,'앞섬.').replace(/줄어듭니다\./g,'줄어듦.').replace(/적게 듭니다/g,'적게 듦')
    .replace(/낫습니다\./g,'나음.').replace(/적어요\./g,'적음.').replace(/받았습니다/g,'받음').replace(/필요해요\./g,'필요함.')
    .replace(/같습니다\./g,'같음.').replace(/같습니다/g,'같음');
}
/* 부대·기관용 구매 검토 보고 문안 (기안문 형식: 1. 2. / 가. 나. / 끝.) */
function reportText(R, rec, rival, lines, close){
  const o = state.org, Y = R.Y, ko = ['가','나','다','라','마','바'];
  const name = x => `${bigName(x.car)} (${x.car.name})`;
  const ranked = R.ranked;
  const budget = num(o.budget);
  const L = [];
  L.push(`제목: ${o.dept ? o.dept + ' ' : ''}업무용 차량 구매 기종 선정 검토 보고`, '');
  L.push('1. 목적');
  L.push(`  ${o.purpose ? o.purpose + '에 사용할 ' : ''}업무용 차량 후보 ${R.cars.length}종을 총소유비용·연비·임무 적합성 기준으로 비교하여 구매 기종을 선정하고자 함.`, '');
  L.push('2. 검토 대상');
  R.cars.forEach((x,i)=>L.push(`  ${ko[i]}. ${name(x)}: 출고가 ${fm(num(x.car.price))}만 원${num(x.car.discount) ? `, 할인 후 ${fm(x.net)}만 원` : ''}, 복합연비 ${f1(x.fuel)}km/L`));
  L.push('');
  L.push('3. 검토 기준');
  L.push(`  가. 평가 항목(가중치): ${crit().map(c=>`${c.label} ${num(state.weights[c.k])}%`).join(', ')}`);
  L.push(`  나. 운용 조건: 보유 ${Y}년, 연 주행 ${f0(R.annualKm)}km, 휘발유 ${f0(num(state.gas))}원/L, ${R.exempt ? '취득세 면제' : '취득세·공채 포함'}`);
  L.push('');
  L.push('4. 검토 결과');
  L.push(`  가. 종합 점수(100점 만점): ${ranked.map(x=>`${bigName(x.car)} ${f1(x.score)}점`).join(', ')}`);
  L.push(`  나. 실구매 총액: ${R.cars.map(x=>`${bigName(x.car)} ${fm(x.total)}만 원`).join(', ')}`);
  L.push(`  다. ${Y}년 총소유비용: ${R.cars.map(x=>`${bigName(x.car)} ${fm(x.cum[Y])}만 원`).join(', ')}`);
  if (budget) L.push(`  라. 예산 한도(${fm(budget)}만 원) 대비: ${R.cars.map(x=>`${bigName(x.car)} ${x.total <= budget ? '이내' : fm(x.total - budget) + '만 원 초과'}`).join(', ')}`);
  L.push('');
  L.push('5. 결론 및 건의');
  if (close) L.push(`  가. 두 기종의 점수 차가 3점 이내(${f1(rec.score)}점 대 ${f1(rival.score)}점)로, 추가 시승·견적 비교 후 재검토를 건의함.`);
  else L.push(`  가. ${name(rec)} 구매를 건의함 (${f1(rec.score)}점, 차순위 ${bigName(rival.car)} ${f1(rival.score)}점).`);
  const good = lines.filter(l=>!l.trade), trade = lines.filter(l=>l.trade);
  if (good.length){ L.push('  나. 선정 사유'); good.forEach(l=>L.push(`    - ${l.tag}: ${formal(l.text)}`)); }
  if (trade.length){ L.push(`  ${good.length ? '다' : '나'}. 고려 사항`); trade.forEach(l=>L.push(`    - ${l.tag}: ${formal(l.text)}`)); }
  if ((state.memo.author||'').trim() || (state.memo.reviewer||'').trim()){
    L.push('', '6. 의견');
    if ((state.memo.author||'').trim()) L.push(`  가. 담당자: ${state.memo.author.trim()}`);
    if ((state.memo.reviewer||'').trim()) L.push(`  ${(state.memo.author||'').trim() ? '나' : '가'}. 검토자: ${state.memo.reviewer.trim()}`);
  }
  L.push('', '붙임  차량 비교 결과 카드 1부.  끝.');
  return L.join('\n');
}
function drawRadar(){
  if (!chartBase()) return;
  const R = compute(state);
  const cv = $('#radarChart'); if (!cv) return;
  charts.push(new Chart(cv, {
    type:'radar',
    data:{ labels: crit().map(c=>c.label), datasets: R.ranked.map(x=>{ const col = carColor(x.car); return {

    options:{ responsive:true, maintainAspectRatio:false,

/* ---------- 이미지 캡처 · 저장 · 공유 ---------- */
let cardBlob = null, captureTimer = 0, capturing = null;
function scheduleCapture(){
  cardBlob = null; cardDirty = true;
  clearTimeout(captureTimer);
  captureTimer = setTimeout(()=>{ getCardBlob().catch(()=>{}); }, 700);
}
async function captureCard(){
  const el = $('#shareCard'); if (!el || !window.html2canvas) return null;
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch(e){}
  const bg = getComputedStyle(el).backgroundColor;
  const canvas = await html2canvas(el, {scale:2, backgroundColor:bg, useCORS:true, logging:false});
  return await new Promise(res=>canvas.toBlob(res,'image/png'));
}
async function getCardBlob(){
  if (cardBlob && !cardDirty) return cardBlob;
  if (capturing) return capturing;
  capturing = captureCard().then(b=>{ cardBlob = b; cardDirty = false; capturing = null; return b; }, e=>{ capturing = null; throw e; });
  return capturing;
}
function fileName(ext){
  const R = compute(state);
  const d = new Date();
  return `${M().file}_${R.ranked.map(x=>x.car.short||x.car.name).slice(0,2).join('_vs_')}_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.${ext}`.replace(/[\\/:*?"<>|\s]+/g,'_');
}
let dlPromise = null;
function getDownloads(){
  if (!dlPromise) dlPromise = (window.claude && typeof window.claude.use === 'function') ? Promise.resolve(window.claude.use('downloads')).catch(()=>null) : Promise.resolve(null);
  return dlPromise;
}
async function saveFile(name, blob, kind){
  const dl = await getDownloads();
  if (dl){
    try { await dl.save({filename:name, data:blob}); return 'saved'; }
    catch(e){
      const code = e && e.code;
      if (code === 'declined'){ toast('저장을 취소했어요'); return 'declined'; }
      if (code === 'rate_limited'){ toast('잠시 후 다시 눌러 주세요'); return 'declined'; }
    }
  }
  // 아티팩트 밖(파일을 직접 연 경우)에서는 일반 다운로드, 안 되면 길게 눌러 저장하는 화면
  let started = false;
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000); started = !window.claude;
  } catch(e){}
  if (!started) showFallback(blob, kind);
  return started ? 'saved' : 'fallback';
}
function showFallback(blob, kind){
  if (kind === 'png'){
    const url = URL.createObjectURL(blob);
    openSheet(`<div class="sheet-head"><h2>이미지</h2><button class="btn sm" type="button" data-close>닫기</button></div>
      <p class="note" style="margin:0">이미지를 길게 눌러 ‘사진에 저장’한 뒤 카톡에서 사진으로 보내 주세요.</p>
      <img class="overlay-img" src="${url}" alt="결론 카드 이미지">`);
  } else {
    blob.text().then(t=>{
      openSheet(`<div class="sheet-head"><h2>백업 내용</h2><button class="btn sm" type="button" data-close>닫기</button></div>
        <p class="note" style="margin:0">파일 저장이 막혀 있어 내용을 보여 드려요. 전체를 복사해 메모 앱에 보관하세요.</p>
        <textarea id="backupText" readonly style="min-height:220px;font-family:var(--f-num);font-size:12px">${esc(t)}</textarea>
        <button class="btn primary" type="button" id="copyBackup">전체 복사</button>`);
    });
  }
}
async function onSavePng(){
  const btn = $('#savePng'); btn.disabled = true; btn.textContent = '이미지 만드는 중…';
  try {
    const blob = await getCardBlob();
    if (!blob) { toast('이미지를 만들지 못했어요. 다시 눌러 주세요.'); return; }
    const r = await saveFile(fileName('png'), blob, 'png');
    if (r === 'saved') toast('이미지를 저장했어요');
  } catch(e){ toast('이미지를 만들지 못했어요. 다시 눌러 주세요.'); }
  finally { btn.disabled = false; btn.textContent = state.mode === 'org' ? '결재 첨부용 이미지 저장' : '이미지 저장'; }
}
async function onShare(){
  const btn = $('#sharePng'); btn.disabled = true; btn.textContent = '준비 중…';
  try {
    const blob = await getCardBlob();
    if (!blob) { toast('이미지를 만들지 못했어요. 다시 눌러 주세요.'); return; }
    const file = new File([blob], fileName('png'), {type:'image/png'});
    if (navigator.canShare && navigator.share && navigator.canShare({files:[file]})){
      try { await navigator.share({files:[file], title:M().share}); return; }
      catch(e){ if (e && e.name === 'AbortError') return; }
    }
    const r = await saveFile(fileName('png'), blob, 'png');
    if (r === 'saved') toast(state.mode === 'org' ? '저장한 이미지를 결재 붙임으로 첨부해 주세요' : '저장한 이미지를 카톡에서 사진으로 보내 주세요', 4000);
  } catch(e){ toast('공유를 준비하지 못했어요. 이미지 저장을 이용해 주세요.'); }
  finally { btn.disabled = false; btn.textContent = state.mode === 'org' ? '공유하기' : '공유하기 (카톡)'; }
}

        <small>외부 주소 사진은 보안 정책 때문에 안 보일 수 있어요. 휴대폰 사진 올리기를 권해요 (자동으로 800px로 줄여 저장).</small>
      </div>
      <label class="field"><span>장점 <small>한 줄에 하나씩</small></span><textarea id="e_pros" rows="4">${esc(d.pros.join('\n'))}</textarea></label>
      <label class="field"><span>단점 <small>한 줄에 하나씩</small></span><textarea id="e_cons" rows="4">${esc(d.cons.join('\n'))}</textarea></label>
      <button class="btn primary wide" type="button" id="e_save">${isNew ? '추가하기' : '저장'}</button>
      ${!isNew && state.cars.length > 2 ? '<button class="btn danger wide" type="button" id="e_delete">이 차 삭제</button>' : ''}
    </div>`);
}
function readEditor(){
  const d = editing.draft;
  const g = id => $('#e_'+id).value;
  d.name = g('name').trim(); d.short = g('short').trim(); d.year = g('year').trim(); d.body = g('body');
  ['price','discount','fuel','length','width','height','wheelbase'].forEach(k=>d[k] = num(g(k)));
  d.power = g('power').trim(); d.powertrain = g('powertrain').trim(); d.drive = g('drive').trim();
  const url = g('photoUrl').trim(); if (url) d.photo = url; else if (d.photo && !d.photo.startsWith('data:')) d.photo = '';
  d.pros = g('pros').split('\n').map(s=>s.trim()).filter(Boolean);
  d.cons = g('cons').split('\n').map(s=>s.trim()).filter(Boolean);
  return d;
}
function saveEditor(){
  const d = readEditor();
  if (!d.name){ toast('이름을 적어 주세요'); $('#e_name').focus(); return; }
  if (!(d.fuel > 0)){ toast('복합연비를 적어 주세요'); $('#e_fuel').focus(); return; }
  if (!(d.price > 0)){ toast('출고가를 적어 주세요'); $('#e_price').focus(); return; }
  if (editing.index < 0) state.cars.push(d); else state.cars[editing.index] = d;
  editing = null; closeSheet(); save(); render();
  toast('저장했어요');
}
function resizePhoto(file){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>{ const img = new Image(); img.onload = ()=>{
      // 16:9로 가운데를 잘라 800×450으로 저장 (이미지 캡처 때 찌그러지지 않게)
      const W = 800, H = 450, s = Math.max(W/img.width, H/img.height);
      const sw = W/s, sh = H/s, sx = (img.width-sw)/2, sy = (img.height-sh)/2;
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      cv.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,W,H);
      res(cv.toDataURL('image/jpeg',0.82));
    }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

function openSettings(){
  openSheet(`
    <div class="sheet-head"><h2>백업·설정</h2><button class="btn sm" type="button" data-close>닫기</button></div>
    <div class="panel"><h3 class="band">클라우드 저장</h3><div id="cloudBody" class="fields" style="padding:14px 16px 16px">${cloudHTML()}</div></div>
    <p class="note" style="margin:0">입력한 내용은 이 브라우저에도 자동 저장돼요. 브라우저 데이터를 지우면 사라지니 가끔 백업해 두세요.</p>
    <button class="btn primary wide" type="button" id="doExport">백업 내보내기 (JSON 파일)</button>
    <button class="btn wide" type="button" id="doImport">백업 불러오기</button>
    <button class="btn danger wide" type="button" id="doReset">기본값으로 초기화</button>
    <p class="note" id="resetHint" style="margin:0" hidden>한 번 더 누르면 두 용도의 입력과 추가한 차가 모두 예제로 돌아가요.</p>`);
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', async e=>{
  const t = e.target.closest('button, [data-scrim]');
  if (!t) return;
  if (t.matches('[data-scrim]')) { if (e.target === t) closeSheet(); return; }
  if (t.dataset.go){ closeSheet(); go(+t.dataset.go); return; }
  if (t.id === 'goHome'){ closeSheet(); armed = ''; goHome(); return; }
  if (t.dataset.open){
    const mode = t.dataset.open, how = t.dataset.how;
    if (how !== 'open' && store[mode].updatedAt && armed !== mode + how){ armed = mode + how; render(); return; }
    armed = ''; openMode(mode, how); toast(how === 'example' ? '예제를 불러왔어요' : how === 'blank' ? '빈 양식을 열었어요' : MODES[mode].name); return;
  }
  if (t.id === 'copyReport'){
    const ta = $('#reportText');
    try { await navigator.clipboard.writeText(ta.value); toast('검토 보고 문안을 복사했어요'); }
    catch(err){ ta.focus(); ta.select(); toast('선택된 문안을 복사해 주세요'); }
    return;
  }
  if (t.id === 'prev'){ go(state.step-1); return; }
  if (t.id === 'next'){ go(state.step === 4 ? 1 : state.step+1); return; }
  if (t.dataset.edit !== undefined){ openEditor(+t.dataset.edit); return; }
  if (t.hasAttribute('data-add')){ openEditor(-1); return; }
  if (t.hasAttribute('data-close')){ closeSheet(); return; }
  if (t.id === 'openSettings'){ openSettings(); return; }
  if (t.id === 'savePng'){ onSavePng(); return; }
  if (t.id === 'sharePng'){ onShare(); return; }
  if (t.id === 'e_save'){ saveEditor(); return; }
  if (t.id === 'e_upload'){ $('#photoFile').click(); return; }
  if (t.id === 'e_clearPhoto'){ editing.draft.photo = ''; $('#e_photoUrl').value=''; editing.draft.body = $('#e_body').value; $('#e_preview').src = photoSrc(editing.draft); return; }
  if (t.id === 'e_delete'){
    if (!editing.confirmDel){ editing.confirmDel = true; t.textContent = '정말 삭제할까요? 한 번 더 누르세요'; return; }
    state.cars.splice(editing.index,1); editing = null; closeSheet(); save(); render(); toast('삭제했어요'); return;
  }
  if (t.id === 'doExport'){
    const blob = new Blob([JSON.stringify({app:'car-decision-helper', exportedAt:new Date().toISOString(), state: store}, null, 2)], {type:'application/json'});
    const r = await saveFile(fileName('json').replace('.json','_백업.json'), blob, 'json');
    if (r === 'saved') toast('백업 파일을 저장했어요');
    return;
  }
  if (t.id === 'doImport'){ $('#importFile').click(); return; }
  if (t.id === 'doReset'){
    if (!t.dataset.armed){ t.dataset.armed = '1'; t.textContent = '정말 초기화하기'; $('#resetHint').hidden = false; return; }
    store = normalizeStore(null); setMode('family'); closeSheet(); save(); store.view = 'home'; saveLocal(); render(); toast('처음 상태로 되돌렸어요'); return;
  }
  if (t.id === 'cloudSend'){
    const email = ($('#cloudEmail').value || '').trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('이메일 주소를 확인해 주세요'); $('#cloudEmail').focus(); return; }
    t.disabled = true; t.textContent = '보내는 중…';
    const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin + '/' } });
    if (error){ t.disabled = false; t.textContent = '로그인 링크 받기'; toast(/rate|limit|seconds/i.test(error.message) ? '잠시 후 다시 시도해 주세요 (메일은 짧은 시간에 여러 번 보낼 수 없어요)' : '링크를 보내지 못했어요. 이메일 주소를 확인해 주세요.', 4000); return; }
    linkSent = email; refreshCloudUI(); toast('로그인 링크를 보냈어요'); return;
  }
  if (t.id === 'cloudPush'){ const ok = await pushNow(); toast(ok ? '클라우드에 저장했어요' : '저장하지 못했어요'); return; }
  if (t.id === 'cloudPull'){ await pullNow(true); return; }
  if (t.id === 'cloudOut'){ await sb.auth.signOut(); cloudUser = null; cloudMsg = ''; linkSent = ''; refreshCloudUI(); toast('로그아웃했어요. 이 브라우저의 내용은 그대로 남아요.'); return; }
  if (t.id === 'copyBackup'){
    const ta = $('#backupText');
    try { await navigator.clipboard.writeText(ta.value); toast('복사했어요'); }
    catch(err){ ta.focus(); ta.select(); toast('선택된 내용을 복사해 주세요'); }
    return;
  }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if (t.dataset.w){ state.weights[t.dataset.w] = num(t.value); $('#wo_'+t.dataset.w).textContent = t.value+'%'; save(); refresh2(); return; }
  if (t.dataset.score){ const i = +t.dataset.car; state.cars[i].scores[t.dataset.score] = num(t.value); const o = $(`#so_${t.dataset.score}_${i}`); if (o) o.textContent = t.value + '점'; save(); refresh2(); return; }
  if (t.dataset.memo){ state.memo[t.dataset.memo] = t.value; save(); return; }
  if (t.dataset.org){ const k = t.dataset.org; state.org[k] = (k === 'budget' || k === 'years') ? num(t.value) : t.value; save(); refresh1(); return; }
  if (t.name === 'taxMode'){ state.taxMode = t.value; save(); refresh3(); return; }
  if (t.dataset.km){ state.km[t.dataset.km] = Math.max(0,num(t.value)); save(); refresh3(); return; }
  if (t.dataset.set){ const k = t.dataset.set; state[k] = k === 'region' ? t.value : num(t.value); save(); if (k !== 'region') refresh3(); return; }
  if (t.name === 'delivery'){ state.delivery = t.value; save(); refresh3(); return; }
  if (t.id === 'e_body' && editing && !editing.draft.photo){ editing.draft.body = t.value; $('#e_preview').src = photoSrc(editing.draft); }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if (t.name === 'delivery'){ state.delivery = t.value; save(); refresh3(); }
  if (t.id === 'e_body' && editing && !editing.draft.photo){ editing.draft.body = t.value; $('#e_preview').src = photoSrc(editing.draft); }
});
document.addEventListener('keydown', e=>{ if (e.key === 'Escape' && $('#sheetRoot').innerHTML) closeSheet(); });

$('#photoFile').addEventListener('change', async e=>{
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f || !editing) return;
  try { const url = await resizePhoto(f); editing.draft.photo = url; $('#e_photoUrl').value = ''; $('#e_preview').src = url; }
  catch(err){ toast('사진을 읽지 못했어요. 다른 사진을 골라 주세요.'); }
});
$('#importFile').addEventListener('change', async e=>{
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const obj = JSON.parse(await f.text());
    const src = obj && obj.state ? obj.state : obj;
    const ok = src && ((src.family && Array.isArray(src.family.cars)) || (Array.isArray(src.cars) && src.cars.length >= 2));
    if (!ok) throw new Error('bad');
    store = normalizeStore(src); setMode(store.mode); store.view = 'flow'; state.step = 1;
    closeSheet(); save(); render(); toast('백업을 불러왔어요');
  } catch(err){ toast('이 앱의 백업 파일이 아니에요. 내보내기로 만든 JSON 파일을 골라 주세요.', 3600); }
});

const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
const rerenderCharts = ()=>{ if (store.view === 'home') return; if (state.step === 3) refresh3(); if (state.step === 4){ killCharts(); drawRadar(); scheduleCapture(); } };
if (mq && mq.addEventListener) mq.addEventListener('change', rerenderCharts);
new MutationObserver(rerenderCharts).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

/* 테스트용 노출 */
window.__carDecision = { compute: ()=>compute(state), store: ()=>store, defaultsFamily, defaultsOrg, reasons };

render();
initCloud();
getDownloads();
rasterizeAll().then(()=>{ if (!$('#sheetRoot').innerHTML) render(); });
})();
</script>
